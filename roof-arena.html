<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">

<title>Four M</title>
<style>

canvas{position:fixed;inset:0}
#sb{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);direction:ltr;display:flex;align-items:center;gap:10px;padding:6px 10px;border:2px solid #e8465f;border-radius:40px;background:rgba(70,60,80,.55)}

#gt.s{animation:g 1.6s both}
@keyframes g{0%{opacity:0;transform:scale(1.7)}15%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0}}
#cr{position:fixed;left:50%;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;pointer-events:none}
#cr:before,#cr:after{content:"";position:absolute;background:#fff;box-shadow:0 0 2px #000}
#cr:before{left:10px;top:0;width:2px;height:22px}
#cr:after{top:10px;left:0;height:2px;width:22px}
#cr.h:before,#cr.h:after{background:#f33}
#dm{position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 120px #e11;opacity:0;transition:opacity .25s}

#ov h1{margin:0;font-size:34px}
#ov p{margin:0;opacity:.85;line-height:1.9;font-size:14px;max-width:420px}
#ov button{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:14px 34px;font-size:18px;font-weight:700}
.tb{position:fixed;border-radius:50%;background:var(--pn);border:2px solid #fff5;color:var(--fg);display:none;align-items:center;justify-content:center;font-size:14px}
.t .tb{display:flex}
#fb{right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(24px + env(safe-area-inset-bottom,0px));width:88px;height:88px;background:rgba(220,50,80,.5)}
#rb{right:calc(116px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));width:64px;height:64px}
#cb{right:calc(190px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));width:64px;height:64px;font-size:12px}
#vw{position:fixed;top:calc(120px + env(safe-area-inset-top,0px));right:12px;background:var(--pn);color:var(--fg);border:1px solid #fff4;border-radius:10px;padding:8px 12px;font-size:13px}
#vm{position:fixed;top:calc(162px + env(safe-area-inset-top,0px));right:12px;display:none;flex-direction:column;gap:6px}
#vm button{background:var(--pn);color:var(--fg);border:1px solid #fff4;border-radius:10px;padding:10px 14px;font-size:14px}
#vm button.on{background:var(--ac);color:#fff}
#jm{right:calc(262px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));width:64px;height:64px;font-size:12px}
#js{position:fixed;width:100px;height:100px;border-radius:50%;border:2px solid #fff5;background:#fff1;display:none;pointer-events:none}
#jk{position:absolute;left:30px;top:30px;width:40px;height:40px;border-radius:50%;background:#fff6}
.tb{transform:scale(var(--bs,1));transform-origin:100% 100%}
#st{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:12px;background:var(--pn);color:var(--fg);border:1px solid #fff4;border-radius:10px;padding:6px 10px;font-size:18px;z-index:5}

.sbox h2{margin:0 0 6px;font-size:20px}
.sbox h3{margin:14px 0 6px;font-size:15px;color:var(--ac)}
.kr{display:flex;justify-content:space-between;align-items:center;margin:6px 0;font-size:14px}
.kr button{background:#222838;color:#fff;border:1px solid #fff4;border-radius:8px;padding:6px 12px;min-width:96px;font-size:14px}

.row{display:flex;gap:8px;margin-top:14px}

#sc{background:var(--ac)!important;color:#fff!important}
#go2{background:#222838;color:#fff;border:1px solid #fff4;border-radius:12px;padding:12px 30px;font-size:16px;margin-top:6px}

.lbx h1{margin:0 0 4px;font-size:28px}.lbx h3{margin:14px 0 8px;font-size:15px;color:var(--ac)}
.sub{margin:0;opacity:.7;font-size:12px}
.g3,.g4{display:grid;gap:8px}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(2,1fr)}
.lbx button{background:#222838;color:#fff;border:1px solid #fff3;border-radius:12px;padding:12px 8px;font-size:15px;font-weight:700}
.lbx button small{display:block;font-weight:400;font-size:11px;opacity:.75;margin-top:2px}
.lbx button.on{background:var(--ac);border-color:var(--ac)}

#lset{margin-top:12px;width:100%}
.lbx p#op{font-size:11px;opacity:.7;margin:10px 0 0;line-height:1.7}
body.play canvas{cursor:none}
#tip{position:fixed;bottom:60px;left:50%;transform:translateX(-50%);background:var(--pn);padding:8px 14px;border-radius:10px;font-size:13px;display:none;z-index:6}
</style>
</head>

<button id="st">⚙</button>
<div id="tip"></div>
<div id="sp"><div class="sbox">
<h2>الإعدادات</h2>
<h3>الكيبورد</h3><div id="kb"></div>
<h3>الماوس / اليد</h3>
<label>حساسية الماوس <input type="range" id="ms" min="0.3" max="2.5" step="0.05"></label>
<label>عكس المحور العمودي <input type="checkbox" id="mi"></label>
<h3>الموبايل</h3>
<label>حساسية اللمس <input type="range" id="ts" min="0.3" max="2.5" step="0.05"></label>
<label>حجم الأزرار <input type="range" id="bs" min="0.7" max="1.5" step="0.05"></label>
<div class="row"><button id="rs">إعادة الافتراضي</button><button id="slb">اللوبي</button><button id="sc">رجوع</button></div>
</div></div>
<div id="ov"><h1></h1><p></p><button id="go">العب مرة ثانية</button><button id="go2">اللوبي</button></div>
<div id="lb"><div class="lbx">
<h1>Four M</h1><p class="sub">اللاعبون الآخرون بوتات (بدون سيرفر أونلاين)</p>
<h3>الماب</h3>
<div class="g4"><button data-map="roof" class="on">السطح<small>نهار</small></button><button data-map="maze">المتاهة<small>ليل أزرق</small></button><button data-map="open">الساحة<small>غروب</small></button><button data-map="tower">الأبراج<small>ضباب أخضر</small></button><button data-map="snow">الثلج<small>أبيض بارد</small></button><button data-map="desert">الصحراء<small>غبار ذهبي</small></button><button data-map="neon">النيون<small>ليل بنفسجي</small></button><button data-map="storm">العاصفة<small>رمادي داكن</small></button></div>

<button data-l="noob">Noob</button><button data-l="pro" class="on">Pro</button><button data-l="max">Max</button><button data-l="ultra">Ultra</button></div>

<div class="g4">
<button data-t="noob">Noob<small>ما يعرف يلعب</small></button>

<button data-t="max">Max<small>لعيب</small></button>
<button data-t="ultra">Ultra<small>جنون</small></button></div>

<p id="op"></p>
</div></div>

<script>
const T=Math.PI*2,V3=THREE.Vector3,S=38,isT=(matchMedia('(any-pointer:coarse)').matches&&!matchMedia('(any-pointer:fine)').matches)||(('ontouchstart' in window)&&!matchMedia('(any-pointer:fine)').matches);

const rd=new THREE.WebGLRenderer({antialias:true});
rd.setPixelRatio(Math.min(devicePixelRatio,2));rd.shadowMap.enabled=true;rd.shadowMap.type=THREE.PCFSoftShadowMap;
rd.outputEncoding=THREE.sRGBEncoding;rd.toneMapping=THREE.ACESFilmicToneMapping;

rsz();addEventListener('resize',rsz);

// textures
function tex(w,draw,rx,ry){const c=document.createElement('canvas');c.width=c.height=w;const x=c.getContext('2d');draw(x,w);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx||1,ry||rx||1);t.encoding=THREE.sRGBEncoding;t.anisotropy=4;return t}
function nz(x,w,n,a){for(let i=0;i<n;i++){const v=Math.random()*255|0;x.fillStyle=`rgba(${v},${v},${v},${a})`;x.fillRect(Math.random()*w,Math.random()*w,1+Math.random()*2,1+Math.random()*2)}}
const fab=c=>tex(64,(x,w)=>{x.fillStyle=c;x.fillRect(0,0,w,w);nz(x,w,500,.14);x.strokeStyle='rgba(0,0,0,.07)';for(let i=0;i<w;i+=4){x.beginPath();x.moveTo(i,0);x.lineTo(i,w);x.stroke()}});
const dotT=(a,b)=>tex(64,(x,w)=>{x.fillStyle=a;x.fillRect(0,0,w,w);x.fillStyle=b;for(let i=0;i<16;i++){x.beginPath();x.arc(Math.random()*w,Math.random()*w,5,0,7);x.fill()}nz(x,w,300,.1)});
const floorT=tex(512,(x,w)=>{x.fillStyle='#b3b8be';x.fillRect(0,0,w,w);nz(x,w,30000,.2);x.strokeStyle='rgba(60,70,80,.25)';x.lineWidth=2;for(let i=0;i<=w;i+=128){x.beginPath();x.moveTo(i,0);x.lineTo(i,w);x.moveTo(0,i);x.lineTo(w,i);x.stroke()}for(let i=0;i<10;i++){x.fillStyle='rgba(0,0,0,.06)';x.beginPath();x.arc(Math.random()*w,Math.random()*w,20+Math.random()*40,0,7);x.fill()}},13);
const parT=tex(128,(x,w)=>{x.fillStyle='#c4cbc0';x.fillRect(0,0,w,w);nz(x,w,3000,.18)},6,1);

const brandT=tex(512,(x,w)=>{x.fillStyle='#4a2c4e';x.fillRect(0,0,w,w);nz(x,w,6000,.1);x.fillStyle='#d9d9de';x.font='italic 900 120px system-ui,sans-serif';x.textAlign='center';x.fillText('ARENA',w/2,w/2+30);x.fillStyle='#ff2d7a';x.fillRect(w/2-150,w/2-70,18,110);x.font='700 24px system-ui';x.fillStyle='#bbb';x.fillText('ROOFTOP GUNFIGHT',w/2,w/2+80)});
const bbT=tex(512,(x,w)=>{const g=x.createLinearGradient(0,0,w,w);g.addColorStop(0,'#0b3d2a');g.addColorStop(.5,'#21e08a');g.addColorStop(1,'#0b3d2a');x.fillStyle=g;x.fillRect(0,0,w,w);x.fillStyle='#fff';x.font='italic 900 90px system-ui,sans-serif';x.textAlign='center';x.fillText('ARENA RP',w/2,w/2+30)});

  for(let i=0;i<26;i++){const cx=Math.random()*w,cy=60+Math.random()*w*.55,r=30+Math.random()*60;const q=x.createRadialGradient(cx,cy,2,cx,cy,r);q.addColorStop(0,'rgba(255,255,255,.95)');q.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=q;x.beginPath();x.ellipse(cx,cy,r*1.6,r*.8,0,0,7);x.fill()}});
sc.background=skyT;sc.fog=new THREE.Fog('#b9d6f2',110,420);

// lights
const hemi=new THREE.HemisphereLight(0xbfdcff,0x777770,.8);sc.add(hemi);
const sun=new THREE.DirectionalLight(0xfff4de,1.35);sun.position.set(30,50,15);sun.castShadow=true;
sun.shadow.mapSize.set(isT?1024:2048,isT?1024:2048);const sh=sun.shadow.camera;sh.left=sh.bottom=-60;sh.right=sh.top=60;sh.near=1;sh.far=150;sun.shadow.bias=-.0004;sc.add(sun);
const lp=new THREE.PointLight(0xffcc66,0,12),le=new THREE.PointLight(0xffcc66,0,12);lp.t=le.t=0;sc.add(lp,le);

// world
const solids=[],obs=[];

function bx(x,z,w,h,d,mat,y0){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,(y0||0)+h/2,z);m.castShadow=m.receiveShadow=true;sc.add(m);solids.push(m);return m}

bx(0,S-.1,S*2,.08,.4,coral);bx(0,-S+.1,S*2,.08,.4,coral);bx(S-.1,0,.4,.08,S*2,coral);bx(-S+.1,0,.4,.08,S*2,coral);

}
const MAPS={
 roof:{n:'السطح',cap:'#ff2d7a',wall:'#ffffff',floor:'#ffffff',f(){pw(0,0,5,3.2,5);pw(-16,-11,14,3.4,1);pw(16,11,14,3.4,1);pw(18,-14,1,3.4,12);pw(-18,14,1,3.4,12);pw(-7,-23,5,3.2,1);pw(7,23,5,3.2,1);pw(-28,3,1,3.2,8);pw(28,-3,1,3.2,8);pw(-10,8,4,3.2,1);pw(10,-8,4,3.2,1)}},
 maze:{n:'المتاهة',cap:'#33d6ff',wall:'#9fc7ff',floor:'#cfd8e6',f(){pw(-20,-18,14,3.4,1);pw(20,-18,14,3.4,1);pw(0,-10,12,3.4,1);pw(-24,-6,1,3.4,10);pw(24,-6,1,3.4,10);pw(-12,0,1,3.4,8);pw(12,0,1,3.4,8);pw(-24,8,10,3.4,1);pw(24,8,10,3.4,1);pw(0,10,12,3.4,1);pw(-20,18,14,3.4,1);pw(20,18,14,3.4,1);pw(-6,-2,1,3.4,5);pw(6,2,1,3.4,5)}},
 open:{n:'الساحة المفتوحة',cap:'#ffb020',wall:'#ffd9a0',floor:'#e9dcc4',f(){pw(0,0,3,4,3);[[-20,-16],[20,-16],[-20,16],[20,16]].forEach(a=>pw(a[0],a[1],3,3.2,3));pw(-10,0,1,2.4,6);pw(10,0,1,2.4,6)}},
 tower:{n:'الأبراج',cap:'#4dff88',wall:'#a9ffd0',floor:'#c5e6cf',f(){for(const x of[-24,-12,0,12,24])for(const z of[-16,0,16])pw(x,z,3,4.5,3)}}
};
Object.assign(MAPS,{

  else if(lid===null){lid=t.identifier;l0={x:t.clientX,y:t.clientY}}}},{passive:false});
cvs.addEventListener('touchmove',e=>{e.preventDefault();for(const t of e.changedTouches){
  if(t.identifier===sid){let dx=t.clientX-so.x,dy=t.clientY-so.y;const l=Math.hypot(dx,dy),m=Math.min(l,50);if(l>0){dx=dx/l*m;dy=dy/l*m}st.x=dx/50;st.y=dy/50;jk.style.transform=`translate(${dx}px,${dy}px)`}
  else if(t.identifier===lid){yaw-=(t.clientX-l0.x)*.006*SET.ts;pitch=Math.max(-.5,Math.min(.6,pitch-(t.clientY-l0.y)*.005*SET.ts));l0={x:t.clientX,y:t.clientY}}}},{passive:false});
const te=e=>{for(const t of e.changedTouches){if(t.identifier===sid){sid=null;st.x=st.y=0;js.style.display='none';jk.style.transform=''}if(t.identifier===lid)lid=null}};
cvs.addEventListener('touchend',te);cvs.addEventListener('touchcancel',te);
const fb=$('#fb'),rb=$('#rb');
fb.addEventListener('touchstart',e=>{e.preventDefault();firing=true},{passive:false});
fb.addEventListener('touchend',()=>firing=false);fb.addEventListener('touchcancel',()=>firing=false);
rb.addEventListener('touchstart',e=>{e.preventDefault();wantRoll=true},{passive:false});
$('#cb').addEventListener('touchstart',e=>{e.preventDefault();P.crouch=!P.crouch},{passive:false});
$('#jm').addEventListener('touchstart',e=>{e.preventDefault();jumpReq=true},{passive:false});
</script>
</body>
</html>
